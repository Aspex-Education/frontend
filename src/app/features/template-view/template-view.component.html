<div class="view-container">
  <!-- Back Button -->
  <button class="back-button" (click)="goBack()">
    ← Volver
  </button>

  <!-- Title -->
  <h1 class="page-title">{{ isSingleViewMode ? 'Tu Plantilla' : 'Plantillas de guía' }}</h1>

  <!-- Loading State -->
  <div class="loading-state" *ngIf="isLoading">
    <p>Cargando...</p>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && isEmpty">
    <p>Aún no hay plantillas de guía disponibles.</p>
  </div>

  <!-- Content -->
  <div *ngIf="!isLoading && !isEmpty">
    <!-- Template Select (Only for guides) -->
    <div class="form-group" *ngIf="!isSingleViewMode">
      <select class="guide-select" [(ngModel)]="selectedTemplate" (ngModelChange)="onSelectTemplate($event)">
        <option [ngValue]="null">Selecciona una plantilla...</option>
        <option *ngFor="let template of templates" [ngValue]="template">
          {{ template.name }}
        </option>
      </select>
    </div>

    <!-- Alert Warning (Only for guides) -->
    <div class="alert-warning" *ngIf="selectedTemplate && !isSingleViewMode">
      <span class="alert-icon">⚠️</span>
      <span>Esta plantilla es solo de guía. Úsala como referencia y ajústala a tu taller.</span>
    </div>

    <!-- Dynamic Content based on Type -->
    <div *ngIf="selectedTemplate && templateType">
      <ng-container [ngSwitch]="templateType">
        <app-template-view-listado 
          *ngSwitchCase="'listado_operaciones'" 
          [template]="selectedTemplate"
          [isSingleViewMode]="isSingleViewMode">
        </app-template-view-listado>

        <app-template-view-sam 
          *ngSwitchCase="'sam'" 
          [template]="selectedTemplate">
        </app-template-view-sam>

        <div *ngSwitchDefault class="empty-state">
          <p>Tipo de plantilla no soportado para previsualización.</p>
        </div>
      </ng-container>
    </div>
  </div>
</div>
