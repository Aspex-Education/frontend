<div class="create-container">
  <!-- Header -->
  <div class="page-header">
    <button class="back-button" (click)="goBack()">
      ← Volver
    </button>
    <button 
      class="save-button"
      [disabled]="!isFormValid || isSaving"
      (click)="save()">
      {{ isSaving ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>

  <!-- Success Message -->
  <div class="success-message" *ngIf="saveSuccess">
    ✓ Plantilla guardada exitosamente
  </div>

  <!-- Error Message -->
  <div class="error-message" *ngIf="saveError">
    {{ saveError }}
  </div>

  <!-- Form Fields -->
  <div class="form-group">
    <label class="form-label">Nombre de la prenda *</label>
    <input 
      type="text" 
      class="form-input"
      [(ngModel)]="productName"
      (ngModelChange)="markDirty()"
      placeholder="Ej: Camisa básica">
  </div>

  <div class="form-group">
    <label class="form-label">Descripción (opcional)</label>
    <textarea 
      class="form-textarea"
      [(ngModel)]="description"
      (ngModelChange)="markDirty()"
      rows="3"
      placeholder="Descripción adicional de la plantilla"></textarea>
  </div>

  <!-- Operations Section -->
  <h2 class="section-title">Listado de operaciones</h2>

  <div class="table-wrapper">
    <table class="operations-table">
      <thead>
        <tr>
          <th style="width: 50px;">N°</th>
          <th>Descripción</th>
          <th style="width: 180px;">Máquina</th>
          <th style="width: 80px;">Seg</th>
          <th style="width: 50px;"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let op of operations; let i = index">
          <td>{{ i + 1 }}</td>
          <td>
            <input 
              type="text"
              [(ngModel)]="op.description"
              (ngModelChange)="markDirty()"
              placeholder="Ej: Coser hombros">
          </td>
          <td>
            <select 
              [(ngModel)]="op.machine"
              (ngModelChange)="markDirty()">
              <option *ngFor="let m of machines" [value]="m.value">
                {{ m.label }}
              </option>
            </select>
          </td>
          <td>
            <input 
              type="number"
              [(ngModel)]="op.time_seconds"
              (ngModelChange)="markDirty()"
              min="0"
              placeholder="0">
          </td>
          <td>
            <button 
              *ngIf="operations.length > 1"
              class="delete-btn"
              (click)="removeOperation(i)"
              title="Eliminar operación">
              🗑
            </button>
          </td>
        </tr>
        <!-- Machine Other Input Row -->
        <tr *ngFor="let op of operations; let i = index">
          <td colspan="5" *ngIf="op.machine === 'other'">
            <div class="machine-other-input">
              <label>Especifica la máquina:</label>
              <input 
                type="text"
                [(ngModel)]="op.machine_other"
                (ngModelChange)="markDirty()"
                placeholder="Nombre de la máquina">
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <button class="add-operation-btn" (click)="addOperation()">
    + Añadir operación
  </button>

  <!-- Totals -->
  <div class="totals-section">
    <div><strong>Total:</strong> {{ totalSeconds }} seg / {{ totalMinutes }} min</div>
  </div>

  <!-- Export Button -->
  <button class="export-btn" disabled title="Próximamente">
    Exportar a PDF
  </button>

  <!-- Video Section -->
  <div class="video-section">
    <h3 class="video-title">── Video explicativo ──</h3>
    <div class="video-wrapper">
      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID_LISTADO"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>
</div>
