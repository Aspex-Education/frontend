<div class="home-container">
  <!-- Top Section: Logo and Welcome Message (Centered) -->
  <section class="welcome-section">
    <div class="logo-container">
      <img src="/assets/company/logo.png" alt="Aspex Educación" class="logo" />
    </div>
    
    <h1 class="welcome-title">¡Bienvenido!</h1>
    
    <p class="welcome-description">
      Somos Aspex Educación, una plataforma enfocada en apoyar la educación de los confeccionistas 
      con herramientas para su negocio, su taller y su crecimiento profesional.
    </p>
  </section>

  <!-- Section: Tus plantillas (Left Aligned) -->
  <section class="templates-section">
    <h2 class="section-title">Tus plantillas</h2>
    
    <div class="templates-content">
      <p *ngIf="userTemplates.length === 0" class="empty-message">
        Aún no has creado tus plantillas.
      </p>
      
      <!-- Placeholder for future template cards grid -->
      <div class="templates-grid" *ngIf="userTemplates.length > 0">
        <!-- Template cards will be added here -->
      </div>
    </div>
  </section>

  <!-- Section: Plantillas para ti (Left Aligned) -->
  <section class="templates-section">
    <h2 class="section-title">Plantillas para ti</h2>
    
    <div class="templates-content">
      <p *ngIf="availableTemplates.length === 0" class="empty-message">
        Aún no hay plantillas disponibles.
      </p>
      
      <!-- Placeholder for future template cards grid -->
      <div class="templates-grid" *ngIf="availableTemplates.length > 0">
        <!-- Template cards will be added here -->
      </div>
    </div>
  </section>
</div>
