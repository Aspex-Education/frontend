<div class="auth-container">
  <div class="auth-side" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="company-header">
      <img src="/assets/company/logo.png" alt="Company logo" class="company-logo" />
    </div>

    <h2>Iniciar sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="form-control"
          [class.is-invalid]="f['email'].invalid && f['email'].touched"
        />
        <div *ngIf="f['email'].invalid && f['email'].touched" class="error-message">
          <small *ngIf="f['email'].errors?.['required']">El correo es obligatorio</small>
          <small *ngIf="f['email'].errors?.['email']">Ingresa un correo válido</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="form-control"
          [class.is-invalid]="f['password'].invalid && f['password'].touched"
        />
        <div *ngIf="f['password'].invalid && f['password'].touched" class="error-message">
          <small *ngIf="f['password'].errors?.['required']">La contraseña es obligatoria</small>
          <small *ngIf="f['password'].errors?.['minlength']">La contraseña debe tener al menos 6 caracteres</small>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn btn-primary" 
        [disabled]="loading || loginForm.invalid"
      >
        <span *ngIf="loading">Iniciando sesión...</span>
        <span *ngIf="!loading">Iniciar sesión</span>
      </button>

      <div class="auth-link">
        ¿No tienes cuenta? <a routerLink="/auth/register">Regístrate aquí</a>
      </div>
    </form>
  </div>
</div>
