<div class="auth-container">
  <div class="auth-card">
    <h2>Login</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          formControlName="username" 
          class="form-control"
          [class.is-invalid]="f['username'].invalid && f['username'].touched"
        />
        <div *ngIf="f['username'].invalid && f['username'].touched" class="error-message">
          <small *ngIf="f['username'].errors?.['required']">Username is required</small>
          <small *ngIf="f['username'].errors?.['minlength']">Username must be at least 3 characters</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="form-control"
          [class.is-invalid]="f['password'].invalid && f['password'].touched"
        />
        <div *ngIf="f['password'].invalid && f['password'].touched" class="error-message">
          <small *ngIf="f['password'].errors?.['required']">Password is required</small>
          <small *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters</small>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn btn-primary" 
        [disabled]="loading || loginForm.invalid"
      >
        <span *ngIf="loading">Logging in...</span>
        <span *ngIf="!loading">Login</span>
      </button>

      <div class="auth-link">
        Don't have an account? <a routerLink="/auth/register">Register here</a>
      </div>
    </form>
  </div>
</div>
