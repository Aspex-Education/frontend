<div id="login-page" class="auth-container">
  <div class="auth-card">
    <div class="company-header">
      <img id="login-logo" src="/assets/company/logo.png" alt="Company logo" class="company-logo" />
    </div>

    <h1 id="login-title" class="auth-title">Acceder al Portal</h1>
    <p id="login-subtitle" class="auth-subtitle">Bienvenido de nuevo. Ingrese sus credenciales para continuar con su formación.</p>

    <form id="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <app-input-text-field
        id="login-email-field"
        label="Correo Electrónico"
        placeholder="ejemplo@academy.com"
        type="email"
        icon="pi pi-envelope"
        inputId="login-email"
        formControlName="email"
        [control]="f['email']"
      />

      <app-input-text-field
        id="login-password-field"
        label="Contraseña"
        placeholder="••••••••"
        type="password"
        icon="pi pi-lock"
        inputId="login-password"
        formControlName="password"
        [control]="f['password']"
      />

      <div id="login-error" *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <app-action-button
        id="login-submit-btn"
        type="submit"
        label="Iniciar Sesión"
        variant="primary"
        size="lg"
        [loading]="loading"
        [disabled]="loginForm.invalid"
        [fullWidth]="true"
      />

      <div class="auth-link">
        ¿No tiene una cuenta todavía?
        <a id="login-register-link" routerLink="/auth/register">Solicitar Ingreso</a>
      </div>
    </form>

    <p id="login-footer" class="auth-footer">© 2024 TEXTILE &amp; FASHION EDUCATIONAL EXCELLENCE</p>
  </div>
</div>
